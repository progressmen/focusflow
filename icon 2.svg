<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 背景方形 -->
  <rect x="2" y="2" width="60" height="60" rx="12" ry="12" fill="url(#iconGradient)" />

  <!-- 时钟外圈 -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="white" stroke-width="3" />

  <!-- 时钟刻度 -->
  <g stroke="white" stroke-width="2">
    <!-- 12点 -->
    <line x1="32" y1="14" x2="32" y2="18" />
    <!-- 3点 -->
    <line x1="50" y1="32" x2="46" y2="32" />
    <!-- 6点 -->
    <line x1="32" y1="50" x2="32" y2="46" />
    <!-- 9点 -->
    <line x1="14" y1="32" x2="18" y2="32" />
  </g>

  <!-- 时钟指针 -->
  <g stroke="white" stroke-width="3" stroke-linecap="round">
    <!-- 时针 -->
    <line x1="32" y1="32" x2="32" y2="23" />
    <!-- 分针 -->
    <line x1="32" y1="32" x2="40" y2="32" />
  </g>

  <!-- AI 元素：小星星 -->
  <g fill="white">
    <path d="M 20 20 L 22 24 L 26 24 L 23 27 L 25 31 L 20 29 L 15 31 L 17 27 L 14 24 L 18 24 Z" />
  </g>

  <!-- 中心点 -->
  <circle cx="32" cy="32" r="2" fill="white" />
</svg>
